<!-- POS G2Virtu module icons for the v16 dock and sidebar header.
     Soft icons draw in the holder's currentColor through the soft-icon classes of frappe's
     common/icons.scss; the duotone header icon fills from the duotone-light and duotone-dark
     custom properties, like ERPNext's module icons. -->
<svg id="posawesome-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<!-- cash register: the app itself -->
	<symbol id="icon-posa-register-soft" viewBox="0 0 24 24" class="soft-icon">
		<path d="M3.5 13.5h17l-1.2 6.2a1.5 1.5 0 0 1-1.5 1.3H6.2a1.5 1.5 0 0 1-1.5-1.3Z" class="soft-body"/>
		<rect x="6" y="7.5" width="12" height="6" rx="1.2" class="soft-body"/>
		<path d="M9 3h6v4.5H9Z"/>
		<path d="M8.5 10.5h1m2 0h1m2 0h1" class="soft-accent-line"/>
		<path d="M10 17.5h4" class="soft-accent-line"/>
	</symbol>
	<symbol id="icon-posa-register-duotone" viewBox="0 0 24 24" stroke="none">
		<path d="M8.5 2.5h7v5h-7Z" style="fill: var(--duotone-light, var(--ink-gray-3))"/>
		<path fill-rule="evenodd" d="M5.5 7.5h13a1 1 0 0 1 1 1V13h-15V8.5a1 1 0 0 1 1-1Z M8 9.75h2v1.5H8Z M11 9.75h2v1.5h-2Z M14 9.75h2v1.5h-2Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))"/>
		<path fill-rule="evenodd" d="M3 14h18l-1.3 6.6a1.5 1.5 0 0 1-1.5 1.4H5.8a1.5 1.5 0 0 1-1.5-1.4Z M9.5 17h5v1.5h-5Z" style="fill: var(--duotone-light, var(--ink-gray-3))"/>
	</symbol>
	<!-- touch terminal -->
	<symbol id="icon-posa-terminal-soft" viewBox="0 0 24 24" class="soft-icon">
		<rect x="3" y="3.5" width="18" height="12.5" rx="2" class="soft-body"/>
		<path d="M12 16v3.5m-4.5 1.5h9"/>
		<path d="M7 8h5m-5 3.5h3" class="soft-accent-line"/>
		<rect x="14" y="7.5" width="3.5" height="4.5" rx=".8" class="soft-accent"/>
	</symbol>
	<!-- dining: RMS -->
	<symbol id="icon-posa-dining-soft" viewBox="0 0 24 24" class="soft-icon">
		<path d="M4 17a8 8 0 0 1 16 0Z" class="soft-body"/>
		<path d="M2.5 17h19M12 9V7.5"/>
		<circle cx="12" cy="6.5" r="1" class="soft-accent"/>
		<path d="M7.5 14a4.5 4.5 0 0 1 3-3" class="soft-accent-line"/>
	</symbol>
	<!-- kitchen display -->
	<symbol id="icon-posa-kitchen-soft" viewBox="0 0 24 24" class="soft-icon">
		<path d="M7 11.5a4 4 0 1 1 3-6.6 4 4 0 0 1 7 2.6 3.5 3.5 0 0 1 0 4Z" class="soft-body"/>
		<path d="M7 11.5V19a1.5 1.5 0 0 0 1.5 1.5h7A1.5 1.5 0 0 0 17 19v-7.5"/>
		<path d="M10 15.5v2m4-2v2" class="soft-accent-line"/>
	</symbol>
	<!-- price checker / signage -->
	<symbol id="icon-posa-kiosk-soft" viewBox="0 0 24 24" class="soft-icon">
		<rect x="5" y="2.5" width="14" height="12" rx="2" class="soft-body"/>
		<path d="M12 14.5v6m-4 0h8"/>
		<path d="M8.5 6v5m2-5v5m3-5v5m2-5v5" class="soft-accent-line"/>
	</symbol>
</svg>
