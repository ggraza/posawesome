[project]
name = "posawesome"
authors = [
    { name = "G2Virtu", email = "info@g2virtu.com" }
]
description = "POS G2Virtu (POS Awesome fork) for Frappe / ERPNext v16"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe, erpnext are installed by bench
    "pyqrcode~=1.2.1",  # FBR / receipt QR codes
    "pypng~=0.20220715.0",  # PNG output for pyqrcode
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"
